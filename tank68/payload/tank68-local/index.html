<!doctype html>
<html lang="zh-CN" data-dc-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TANK68HE</title>
    <script src="theme/theme.js"></script>
    <link rel="stylesheet" href="theme/mchose-shell.css" />

  </head>
  <body>
    <div class="dc-page">
      <header class="dc-official-header">
        <button id="backHome" class="left back" type="button">

      <div class="dc-main">
